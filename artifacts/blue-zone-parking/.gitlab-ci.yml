# GitLab Pages — index.html must end up at the site root.
pages:
  image: alpine:latest
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html public/index.html
    - cp index.html public/404.html
    - cp manifest.webmanifest public/manifest.webmanifest
    - cp sw.js public/sw.js
    - cp -r icons public/icons
    - touch public/.nojekyll
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
